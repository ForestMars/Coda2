name: Toolserver image

on:
  pull_request:
    paths:
      - '.github/workflows/toolserver-image.yml'
      - 'packages/tools/mcpServer.ts'
      - 'packages/tools/registry.json'
      - 'packages/tools/hello_world/**'
      - 'services/toolserver/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/toolserver-image.yml'
      - 'packages/tools/mcpServer.ts'
      - 'packages/tools/registry.json'
      - 'packages/tools/hello_world/**'
      - 'services/toolserver/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Test hello-world tool
        run: bun test packages/tools/hello_world/index.test.ts
      - uses: docker/setup-buildx-action@v3
      - name: Build standalone toolserver image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/toolserver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
